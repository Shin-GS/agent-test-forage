spring:
  application:
    name: ai-test-forge-server

  # ── DB (MySQL) ──
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_test_forge}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info

# ── ai-test-forge 커스텀 설정 ──
ai-test-forge:
  # 라이브러리 등록 요청 인증용 공유 시크릿. 프로덕션은 환경변수로 주입.
  register-token: ${TESTFORGE_TOKEN:local-dev-token}
  # FE(브라우저)에서의 채팅/실행 API 호출 허용 origin. credentials 허용을 위해 명시적 목록 사용.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jira:
    base-url: ${JIRA_BASE_URL:}
    api-token: ${JIRA_API_TOKEN:}   # 시크릿. .env / 환경변수로 주입
  # ── AI 설정 (OpenAI 호환: OpenAI / OpenRouter 등) ──
  # api-key가 비어 있으면 실제 AI 대신 규칙 기반 목(RuleBasedIntentResolver)이 동작한다.
  # provider/model의 런타임 변경(설정 페이지)은 추후 — 지금은 프로퍼티(.env)로 주입.
  ai:
    base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${AI_API_KEY:}                       # 시크릿. .env / 환경변수로 주입
    reasoning-model: ${AI_MODEL_REASONING:openai/gpt-4o}
    fast-model: ${AI_MODEL_FAST:openai/gpt-4o-mini}
    history-limit: ${AI_HISTORY_LIMIT:15}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  # ── 레시피 실행 설정 (표시/권장 한도, 설정 파일로만 변경) ──
  execution:
    step-timeout-seconds: ${EXEC_STEP_TIMEOUT:30}
    recipe-timeout-seconds: ${EXEC_RECIPE_TIMEOUT:300}
